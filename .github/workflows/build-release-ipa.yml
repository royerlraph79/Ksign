name: Build Ksign

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Use Xcode 26.2
        run: |
          ls /Applications
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Build Ksign
        run: |
          make clean
          make

      - name: Prepare IPA
        run: |
          mkdir -p upload
          cp packages/*.ipa upload/Ksign.ipa
          ls -lah upload

      - name: Upload IPA to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: beta
          prerelease: true
          files: upload/Ksign.ipa
