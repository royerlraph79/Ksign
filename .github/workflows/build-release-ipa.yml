name: Build Ksign

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Use Xcode 26.2
        run: |
          ls /Applications
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Build Ksign
        run: |
          make clean
          make

      - name: Prepare IPA
        run: |
          mkdir -p upload
          cp packages/*.ipa upload/Ksign.ipa
          ls -lah upload

      - name: Create or update beta release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="beta"
          FILE="upload/Ksign.ipa"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "$TAG" \
              --prerelease \
              --notes "Automated build"
          fi
